aid: fibe
name: Fibe
description: >-
  Fibe (formerly EarlySalary) is a digital consumer lending platform in India, founded in
  2015 and headquartered in Pune. It offers instant personal loans up to Rs 10 lakh, loans
  against mutual funds, fixed deposits, a co-branded Fibe Axis Bank credit card, insurance,
  and purpose-driven (BNPL) financing across education, healthcare, travel, e-commerce, and
  solar. As of March 2026 Fibe reports over Rs 48,000 crore disbursed across 9.8 million loans
  to 3.3 million customers and 46 million app downloads. Fibe is ISO/IEC 27001, SOC 2, and PCI
  DSS certified. Notably, Fibe operates a live, OAuth-protected Model Context Protocol (MCP)
  server that lets AI agents read loan/eligibility information and initiate loan applications
  (scopes loan.read and loan.apply). Fibe publishes no public REST/OpenAPI developer surface;
  its machine-facing surface is the MCP server, secured with OAuth 2.0 authorization-code +
  PKCE and dynamic client registration.
